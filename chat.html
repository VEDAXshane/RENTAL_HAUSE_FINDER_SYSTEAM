
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages - Rental House Finder</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
    height: 100vh;
}

button, input {
    font: inherit;
}

button {
    cursor: pointer;
}

.chat-container {
    display: flex;
    height: 100vh;
    background: white;
}

/* SIDEBAR */

.sidebar {
    width: 340px;
    border-right: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    background: white;
}

.sidebar-header {
    padding: 22px;
    border-bottom: 1px solid #e2e8f0;
}

.sidebar-header h2 {
    font-size: 22px;
    margin-bottom: 7px;
}

.sidebar-header p {
    font-size: 13px;
    color: #64748b;
}

.current-user {
    margin: 15px;
    background: #eff6ff;
    padding: 13px;
    border-radius: 10px;
}

.current-user small {
    color: #64748b;
    display: block;
    margin-bottom: 7px;
}

.current-user strong {
    color: #1d4ed8;
    display: block;
    margin-bottom: 10px;
}

.current-user select {
    width: 100%;
    padding: 9px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    background: white;
}

/* Demo identity selector is only for testing */
.demo-label {
    font-size: 10px;
    color: #64748b;
    margin-top: 8px;
}

.search-box {
    padding: 0 15px 15px;
}

.search-box input {
    width: 100%;
    padding: 11px;
    border: 1px solid #dbe2ea;
    border-radius: 9px;
    outline: none;
}

.search-box input:focus {
    border-color: #2563eb;
}

.chat-list {
    flex: 1;
    overflow-y: auto;
}

.chat-item {
    display: flex;
    gap: 11px;
    align-items: center;
    padding: 14px;
    border-bottom: 1px solid #f1f5f9;
    cursor: pointer;
}

.chat-item:hover {
    background: #f8fafc;
}

.chat-item.active {
    background: #eff6ff;
    border-left: 4px solid #2563eb;
}

.avatar {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2563eb;
    color: white;
    font-weight: bold;
}

.chat-info {
    flex: 1;
    min-width: 0;
}

.chat-info h4 {
    font-size: 14px;
    margin-bottom: 5px;
}

.chat-info p {
    font-size: 12px;
    color: #64748b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-meta {
    text-align: right;
}

.chat-time {
    font-size: 10px;
    color: #94a3b8;
}

.role-tag {
    display: inline-block;
    margin-top: 5px;
    padding: 3px 7px;
    background: #f1f5f9;
    border-radius: 20px;
    color: #64748b;
    font-size: 10px;
}

/* CHAT MAIN */

.chat-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.chat-header {
    min-height: 78px;
    padding: 15px 20px;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: white;
}

.chat-header-user {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.chat-header-user h3 {
    font-size: 15px;
    margin-bottom: 5px;
}

.chat-header-user p {
    font-size: 12px;
    color: #16a34a;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.back-btn {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 13px;
    font-size: 12px;
    font-weight: bold;
}

.back-btn:hover {
    background: #1d4ed8;
}

/* PROPERTY INFORMATION */

.property-info {
    padding: 12px 20px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.property-info strong {
    font-size: 13px;
}

.property-info p {
    color: #64748b;
    font-size: 12px;
    margin-top: 4px;
}

.property-label {
    color: #2563eb;
    font-size: 11px;
    font-weight: bold;
}

/* MESSAGES */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: #f8fafc;
}

.date-divider {
    text-align: center;
    font-size: 11px;
    color: #94a3b8;
    margin: 8px 0;
}

.message-row {
    display: flex;
    flex-direction: column;
    max-width: 75%;
}

.message-row.received {
    align-self: flex-start;
}

.message-row.sent {
    align-self: flex-end;
}

.sender-name {
    font-size: 11px;
    color: #64748b;
    margin-bottom: 5px;
}

.message-bubble {
    padding: 12px 15px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.received .message-bubble {
    background: white;
    color: #334155;
    border: 1px solid #e2e8f0;
    border-bottom-left-radius: 4px;
}

.sent .message-bubble {
    background: #2563eb;
    color: white;
    border-bottom-right-radius: 4px;
}

.message-time {
    font-size: 10px;
    color: #94a3b8;
    margin-top: 5px;
}

.sent .message-time {
    text-align: right;
}

/* INPUT */

.chat-input-area {
    padding: 15px 20px;
    border-top: 1px solid #e2e8f0;
    background: white;
}

.chat-form {
    display: flex;
    gap: 10px;
}

.chat-form input {
    flex: 1;
    padding: 13px;
    border: 1px solid #dbe2ea;
    border-radius: 10px;
    outline: none;
}

.chat-form input:focus {
    border-color: #2563eb;
}

.send-btn {
    padding: 12px 22px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 9px;
    font-weight: bold;
}

.send-btn:hover {
    background: #1d4ed8;
}

.chat-form input:disabled,
.chat-form button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* EMPTY STATE */

.empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 25px;
    color: #64748b;
    background: #f8fafc;
}

.empty-state h2 {
    margin-bottom: 10px;
    color: #334155;
}

.empty-state p {
    font-size: 14px;
    line-height: 1.6;
}

.no-chats {
    text-align: center;
    padding: 25px 10px;
    font-size: 13px;
    color: #94a3b8;
}

.notice {
    padding: 9px 12px;
    background: #fffbeb;
    color: #92400e;
    border: 1px solid #fde68a;
    border-radius: 8px;
    font-size: 11px;
    margin: 0 15px 15px;
}

/* MOBILE */

@media(max-width: 750px) {

    .sidebar {
        width: 260px;
    }

    .chat-header {
        padding: 12px;
        flex-wrap: wrap;
    }

    .messages {
        padding: 15px;
    }

    .message-row {
        max-width: 88%;
    }
}

@media(max-width: 520px) {

    .sidebar {
        width: 105px;
    }

    .sidebar-header {
        padding: 12px 8px;
    }

    .sidebar-header h2 {
        font-size: 15px;
    }

    .sidebar-header p {
        display: none;
    }

    .current-user {
        margin: 6px;
        padding: 7px;
    }

    .current-user small {
        font-size: 9px;
    }

    .current-user strong {
        font-size: 10px;
    }

    .current-user select {
        padding: 5px;
        font-size: 10px;
    }

    .demo-label {
        font-size: 8px;
    }

    .search-box {
        padding: 5px;
    }

    .search-box input {
        padding: 7px 4px;
        font-size: 10px;
    }

    .chat-item {
        flex-direction: column;
        padding: 9px 4px;
        text-align: center;
        gap: 5px;
    }

    .avatar {
        width: 36px;
        height: 36px;
        font-size: 11px;
    }

    .chat-info h4 {
        font-size: 10px;
    }

    .chat-info p {
        display: none;
    }

    .chat-meta {
        display: none;
    }

    .role-tag {
        font-size: 8px;
        padding: 2px 4px;
    }

    .chat-header-user h3 {
        font-size: 12px;
    }

    .chat-header-user p {
        font-size: 10px;
    }

    .back-btn {
        padding: 8px;
        font-size: 10px;
    }

    .property-info {
        padding: 10px;
    }

    .property-info strong {
        font-size: 11px;
    }

    .property-info p {
        font-size: 10px;
    }

    .messages {
        padding: 10px;
    }

    .message-bubble {
        font-size: 12px;
        padding: 10px;
    }

    .chat-input-area {
        padding: 10px;
    }

    .chat-form input {
        padding: 10px;
        font-size: 12px;
    }

    .send-btn {
        padding: 10px;
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="chat-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-header">
            <h2>Messages</h2>
            <p>Rental House Finder</p>
        </div>

        <!-- CURRENT USER -->
        <div class="current-user">

            <small>Logged in as</small>

            <strong id="currentUserName">Loading...</strong>

            <select id="userSwitcher">
                <option value="renter-001">John Peter (Renter)</option>
                <option value="owner-001">Amina Joseph (Owner)</option>
                <option value="admin-001">Rental Admin (Admin)</option>
            </select>

            <div class="demo-label">
                Demo identity switcher (testing only)
            </div>

        </div>

        <div class="search-box">
            <input type="text" id="searchChat" placeholder="Search conversations...">
        </div>

        <div class="chat-list" id="chatList"></div>

    </aside>

    <!-- CHAT AREA -->
    <main class="chat-main">

        <header class="chat-header">

            <div class="chat-header-user">
                <div class="avatar" id="headerAvatar">?</div>

                <div>
                    <h3 id="headerName">Select a conversation</h3>
                    <p id="headerStatus">Messages</p>
                </div>
            </div>

            <div class="header-actions">
                <button class="back-btn" onclick="backToDashboard()">
                    ← Dashboard
                </button>
            </div>

        </header>

        <div class="property-info" id="propertyInfo" style="display:none">
            <div>
                <strong id="propertyName">Property</strong>
                <p id="propertyLocation">Location</p>
            </div>

            <span class="property-label">PROPERTY CHAT</span>
        </div>

        <div class="messages" id="messages">

            <div class="empty-state">
                <h2>Rental Messages</h2>
                <p>Select a conversation to view messages.</p>
            </div>

        </div>

        <div class="chat-input-area">

            <form class="chat-form" id="chatForm">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Write a message..."
                    maxlength="1000"
                    autocomplete="off"
                    disabled
                >

                <button type="submit" class="send-btn" disabled>
                    Send
                </button>

            </form>

        </div>

    </main>

</div>

<script>

/* =====================================
   DEMO USERS
===================================== */

const demoUsers = {

    "renter-001": {
        id: "renter-001",
        name: "John Peter",
        role: "renter"
    },

    "owner-001": {
        id: "owner-001",
        name: "Amina Joseph",
        role: "owner"
    },

    "admin-001": {
        id: "admin-001",
        name: "Rental Admin",
        role: "admin"
    }

};


/* =====================================
   DEMO CONVERSATIONS
===================================== */

const defaultConversations = [

    {
        id: "conversation-001",

        property: {
            id: "property-001",
            name: "2 Bedroom House",
            location: "Kihonda, Morogoro"
        },

        participantIds: ["renter-001", "owner-001"],

        messages: [
            {
                id: 1,
                senderId: "renter-001",
                receiverId: "owner-001",
                text: "Hello, I am interested in this house. Is it available?",
                time: "10:25 AM",
                date: "Today"
            },

            {
                id: 2,
                senderId: "owner-001",
                receiverId: "renter-001",
                text: "Hello John. Yes, the house is still available.",
                time: "10:30 AM",
                date: "Today"
            }
        ]
    },

    {
        id: "conversation-002",

        property: {
            id: "property-002",
            name: "Single Room",
            location: "Mazimbu, Morogoro"
        },

        participantIds: ["renter-001", "admin-001"],

        messages: [
            {
                id: 3,
                senderId: "admin-001",
                receiverId: "renter-001",
                text: "Welcome to Rental House Finder support. How can we help you?",
                time: "Yesterday",
                date: "Yesterday"
            }
        ]
    }

];


/* =====================================
   CURRENT USER
===================================== */

// Demo default user
// Later this will come from PHP Session.

let currentUserId =
    localStorage.getItem("rentalCurrentUser") || "renter-001";

if (!demoUsers[currentUserId]) {
    currentUserId = "renter-001";
}

let currentUser = demoUsers[currentUserId];


/* =====================================
   LOAD CONVERSATIONS
===================================== */

let conversations = JSON.parse(
    localStorage.getItem("rentalConversations")
) || defaultConversations;

let activeConversationId = null;


/* =====================================
   SAVE
===================================== */

function saveConversations() {

    localStorage.setItem(
        "rentalConversations",
        JSON.stringify(conversations)
    );

}


/* =====================================
   DASHBOARD NAVIGATION
===================================== */

function backToDashboard() {

    if (currentUser.role === "renter") {
        window.location.href = "renter-dashboard.html";
    }

    else if (currentUser.role === "owner") {
        window.location.href = "owner-dashboard.html";
    }

    else if (currentUser.role === "admin") {
        window.location.href = "admin-dashboard.html";
    }

    else {
        window.location.href = "login.html";
    }

}


/* =====================================
   GET OTHER PARTICIPANT
===================================== */

function getOtherParticipant(conversation) {

    const otherId = conversation.participantIds.find(
        id => id !== currentUserId
    );

    return demoUsers[otherId] || {
        id: otherId,
        name: "Unknown User",
        role: "user"
    };

}


/* =====================================
   GET LAST MESSAGE
===================================== */

function getLastMessage(conversation) {

    if (!conversation.messages.length) {
        return "No messages yet";
    }

    return conversation.messages[
        conversation.messages.length - 1
    ].text;

}


/* =====================================
   DISPLAY CONVERSATIONS
===================================== */

function displayConversations(search = "") {

    const chatList = document.getElementById("chatList");

    chatList.innerHTML = "";

    const myConversations = conversations.filter(conversation =>
        conversation.participantIds.includes(currentUserId)
    );

    const filtered = myConversations.filter(conversation => {

        const otherUser = getOtherParticipant(conversation);

        const property = conversation.property;

        const searchable = (
            otherUser.name + " " +
            otherUser.role + " " +
            property.name + " " +
            property.location
        ).toLowerCase();

        return searchable.includes(search.toLowerCase());

    });

    if (filtered.length === 0) {

        chatList.innerHTML = `
            <div class="no-chats">
                No conversations found.
            </div>
        `;

        return;
    }

    filtered.forEach(conversation => {

        const otherUser = getOtherParticipant(conversation);

        const lastMessage = getLastMessage(conversation);

        const item = document.createElement("div");

        item.className = "chat-item";

        if (conversation.id === activeConversationId) {
            item.classList.add("active");
        }

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = getInitials(otherUser.name);

        const info = document.createElement("div");
        info.className = "chat-info";

        const name = document.createElement("h4");
        name.textContent = otherUser.name;

        const preview = document.createElement("p");
        preview.textContent = lastMessage;

        const role = document.createElement("span");
        role.className = "role-tag";
        role.textContent = otherUser.role.toUpperCase();

        info.appendChild(name);
        info.appendChild(preview);
        info.appendChild(role);

        const meta = document.createElement("div");
        meta.className = "chat-meta";

        const time = document.createElement("span");
        time.className = "chat-time";

        const last = conversation.messages[
            conversation.messages.length - 1
        ];

        time.textContent = last ? last.time : "";

        meta.appendChild(time);

        item.appendChild(avatar);
        item.appendChild(info);
        item.appendChild(meta);

        item.addEventListener("click", () => {
            openConversation(conversation.id);
        });

        chatList.appendChild(item);

    });

}


/* =====================================
   OPEN CONVERSATION
===================================== */

function openConversation(conversationId) {

    const conversation = conversations.find(
        c => c.id === conversationId
    );

    if (!conversation) return;

    if (!conversation.participantIds.includes(currentUserId)) {
        alert("You are not allowed to access this conversation.");
        return;
    }

    activeConversationId = conversationId;

    const otherUser = getOtherParticipant(conversation);

    document.getElementById("headerName").textContent =
        otherUser.name;

    document.getElementById("headerAvatar").textContent =
        getInitials(otherUser.name);

    document.getElementById("headerStatus").textContent =
        otherUser.role.toUpperCase() + " • Conversation";

    document.getElementById("propertyInfo").style.display = "flex";

    document.getElementById("propertyName").textContent =
        conversation.property.name;

    document.getElementById("propertyLocation").textContent =
        conversation.property.location;

    document.getElementById("messageInput").disabled = false;

    document.querySelector(".send-btn").disabled = false;

    displayConversations(
        document.getElementById("searchChat").value
    );

    displayMessages(conversation);

}


/* =====================================
   DISPLAY MESSAGES
===================================== */

function displayMessages(conversation) {

    const container = document.getElementById("messages");

    container.innerHTML = "";

    if (conversation.messages.length === 0) {

        const empty = document.createElement("div");

        empty.className = "empty-state";

        empty.innerHTML = `
            <h2>Start Conversation</h2>
            <p>Send your first message to begin.</p>
        `;

        container.appendChild(empty);

        return;
    }

    conversation.messages.forEach(message => {

        const sender = demoUsers[message.senderId];

        const isMine = message.senderId === currentUserId;

        const row = document.createElement("div");

        row.className = "message-row " +
            (isMine ? "sent" : "received");

        const senderName = document.createElement("div");

        senderName.className = "sender-name";

        senderName.textContent = isMine
            ? "You"
            : (sender ? sender.name : "Unknown User");

        const bubble = document.createElement("div");

        bubble.className = "message-bubble";

        bubble.textContent = message.text;

        const time = document.createElement("div");

        time.className = "message-time";

        time.textContent = message.date + " • " + message.time;

        row.appendChild(senderName);
        row.appendChild(bubble);
        row.appendChild(time);

        container.appendChild(row);

    });

    container.scrollTop = container.scrollHeight;

}


/* =====================================
   SEND MESSAGE
===================================== */

document.getElementById("chatForm").addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const input = document.getElementById("messageInput");

        const text = input.value.trim();

        if (!text || !activeConversationId) return;

        const conversation = conversations.find(
            c => c.id === activeConversationId
        );

        if (!conversation) return;

        const receiver = getOtherParticipant(conversation);

        const now = new Date();

        const time = now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

        const date = now.toLocaleDateString();

        const newMessage = {

            id: Date.now(),

            senderId: currentUserId,

            receiverId: receiver.id,

            text: text,

            time: time,

            date: date

        };

        conversation.messages.push(newMessage);

        saveConversations();

        displayMessages(conversation);

        displayConversations(
            document.getElementById("searchChat").value
        );

        input.value = "";

        input.focus();

    }
);


/* =====================================
   SEARCH
===================================== */

document.getElementById("searchChat").addEventListener(
    "input",
    function() {
        displayConversations(this.value);
    }
);


/* =====================================
   SWITCH DEMO USER
===================================== */

document.getElementById("userSwitcher").addEventListener(
    "change",
    function() {

        currentUserId = this.value;

        localStorage.setItem(
            "rentalCurrentUser",
            currentUserId
        );

        currentUser = demoUsers[currentUserId];

        activeConversationId = null;

        updateCurrentUser();

        resetChat();

        displayConversations();

    }
);


/* =====================================
   UPDATE USER INFORMATION
===================================== */

function updateCurrentUser() {

    document.getElementById("currentUserName").textContent =
        currentUser.name + " (" + currentUser.role + ")";

    document.getElementById("userSwitcher").value =
        currentUserId;

}


/* =====================================
   RESET CHAT AREA
===================================== */

function resetChat() {

    document.getElementById("headerName").textContent =
        "Select a conversation";

    document.getElementById("headerAvatar").textContent = "?";

    document.getElementById("headerStatus").textContent =
        "Messages";

    document.getElementById("propertyInfo").style.display = "none";

    document.getElementById("messages").innerHTML = `
        <div class="empty-state">
            <h2>Welcome, ${currentUser.name}</h2>
            <p>Select a conversation to read and send messages.</p>
        </div>
    `;

    document.getElementById("messageInput").disabled = true;

    document.querySelector(".send-btn").disabled = true;

    document.getElementById("messageInput").value = "";

}


/* =====================================
   INITIALS
===================================== */

function getInitials(name) {

    return name
        .split(" ")
        .filter(Boolean)
        .map(word => word[0])
        .join("")
        .substring(0, 2)
        .toUpperCase();

}


/* =====================================
   INITIALIZE CHAT
===================================== */

document.getElementById("userSwitcher").value = currentUserId;

updateCurrentUser();

displayConversations();

</script>

</body>
</html>
