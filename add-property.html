<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property - Smart Rental Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef3ff;
            color: #172554;
            padding: 25px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .logo {
            font-size: 19px;
            font-size: 19px;
            font-weight: bold;
            color: #0755d9;
        }

        .back-btn {
            text-decoration: none;
            background: #eaf1ff;
            color: #0755d9;
            padding: 10px 15px;
            border-radius: 7px;
            font-size: 13px;
        }

        h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* FORM */
        .section {
            margin-bottom: 28px;
        }

        .section h3 {
            font-size: 17px;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5eaf3;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce4f2;
            border-radius: 7px;
            outline: none;
            font-size: 13px;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0755d9;
        }

        textarea {
            height: 110px;
            resize: vertical;
        }

        /* IMAGE UPLOAD */
        .upload-box {
            border: 2px dashed #9bb9f4;
            background: #f5f8ff;
            background: #f5f8ff;
            padding: 30px 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
        }

        .upload-box .upload-icon {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .upload-box h4 {
            font-size: 14px;
            margin-bottom: 7px;
        }

        .upload-box p {
            font-size: 12px;
            color: #64748b;
        }

        .upload-box input {
            display: none;
        }

        .upload-button {
            display: inline-block;
            margin-top: 15px;
            background: #0755e8;
            color: white;
            padding: 10px 17px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            margin-top: 15px;
            margin-top: 15px;
        }

        .preview-item {
            position: relative;
        }

        .preview img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 7px;
        }

        .remove-image {
            position: absolute;
            top: 4px;
            right: 4px;
            border: none;
            background: #dc2626;
            color: white;
            border-radius: 50%;
            width: 23px;
            height: 23px;
            cursor: pointer;
        }

        /* AMENITIES */
        .amenities {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .amenities label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
        }
        

        .amenities input {
            width: auto;
            accent-color: #0755e8;
        }

        /* BUTTONS */
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .submit-btn {
            flex: 1;
            background: #0755e8;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #003db5;
        }

        .cancel-btn {
            background: #e9eef8;
            color: #334155;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* RESPONSIVE */
        @media(max-width: 650px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 17px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .amenities {
                grid-template-columns: repeat(2, 1fr);
            }

            .buttons {
                flex-direction: column;
            }

            .header {
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">
                Smart Rental Finder
            </div>
            <a href="owner-dashboard.html" class="back-btn">
                ← Dashboard
            </a>
        </div>
        <h2>Add New Property</h2>
        <p class="subtitle">
            Fill in the details below to list your property for rent.
        </p>
        <form id="propertyForm">
            <!-- PROPERTY INFORMATION -->
            <div class="section">
                <h3> Property Information</h3>
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Property Title</label>
                        <input type="text" id="title" placeholder="e.g. Modern 3 Bedroom House" required>
                    </div>
                    <div class="form-group">
                        <label>Property Type</label>
                        <select id="type" required>
                            <option value="">Select Property Type</option>
                            <option>House</option>
                            <option>Apartment</option>
                            <option>Single Room</option>
                            <option>Double Room</option>
                            <option>Studio</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Monthly Rental Price (TZS)</label>
                        <input type="number" id="price" min="1" placeholder="e.g. 550000" required>
                    </div>
                    <div class="form-group">
                        <label>Region</label>
                        <input type="text" id="region" placeholder="e.g. Morogoro" required>
                    </div>
                    <div class="form-group">
                        <label>Specific Location</label>
                        <input type="text" id="location" placeholder="e.g. Big Mjini" required>
                    </div>
                    <div class="form-group">
                        <label>Bedrooms</label>
                        <input type="number" id="bedrooms" min="0" placeholder="Number of bedrooms" required>
                    </div>
                    <div class="form-group">
                        <label>Bathrooms</label>
                        <input type="number" id="bathrooms" min="0" placeholder="Number of bathrooms" required>
                    </div>
                    <div class="form-group full">
                        <label>Property Description</label>
                   
                        <textarea id="description"
                            placeholder="Describe your property, facilities and nearby services..." required></textarea>
                    </div>
                </div>
            </div>
            <!-- PROPERTY PHOTOS -->
            <div class="section">
                <h3> Upload Property Photos</h3>
                <label class="upload-box" for="photos">
                    <div class="upload-icon">
                         </div>
                            <h4>Upload Property Images</h4>
                            <p>Choose photos from your device.</p>
                            <span class="upload-button">
                                Browse Images
                            </span>
                            <input type="file" id="photos" accept="image/*" multiple>
                </label>
                <div class="preview" id="preview"></div>
            </div>
            <!-- AMENITIES -->
            <div class="section">
                <h3> Property Amenities</h3>
                <div class="amenities">
                    <label>
                        <input type="checkbox" value="Water">
                        Water Supply
                    </label>
                    <label>
                        <input type="checkbox" value="Electricity">
                        Electricity
                    </label>
                    <label>
                        <input type="checkbox" value="Parking">
                        Parking
                    </label>
                    <label>
                        <input type="checkbox" value="Security">
                        Security
                    </label>
                    <label>
                        <input type="checkbox" value="Internet">
                        Internet
                    </label>
                    <label>
                        <input type="checkbox" value="Garden">
                        Garden
                    </label>
                    <label>
                 
                        <input type="checkbox" value="Kitchen">
                        Kitchen
                    </label>
                    <label>
                        <input type="checkbox" value="Furnished">
                        Furnished
                    </label>
                    <label>
                        <input type="checkbox" value="Balcony">
                        Balcony
                    </label>
                </div>
            </div>
            <!-- FORM BUTTONS -->
            <div class="buttons">
                <button type="button" class="cancel-btn" onclick="resetForm()">
                    Clear Form
                </button>
                <button type="submit" class="submit-btn">
                    Submit Property →
                </button>
            </div>
        </form>
    </div>
    <script>
        
// IMAGE UPLOAD PREVIEW
            const photoInput = document.getElementById("photos");
            const preview = document.getElementById("preview");
            let selectedFiles = [];
            photoInput.addEventListener("change", function() {
const newFiles = Array.from(this.files);
newFiles.forEach(file => {
if (!file.type.startsWith("image/")) return;
if (!selectedFiles.some(item =>
            item.name === file.name &&
            item.size === file.size)) {
                selectedFiles.push(file);
}
});
            renderImages();
});
            function renderImages() {
                preview.innerHTML = "";
selectedFiles.forEach((file, index) => {
const div = document.createElement("div");
            div.className = "preview-item";
            div.className = "preview-item";
            const img = document.createElement("img");
            const imageURL = URL.createObjectURL(file);
            img.src = imageURL;
            const remove = document.createElement("button");
            remove.className = "remove-image";
            remove.textContent = "×";
            remove.type = "button";
            remove.onclick = function() {
                URL.revokeObjectURL(imageURL);
            selectedFiles.splice(index, 1);
            renderImages();
};
            div.appendChild(img);
            div.appendChild(remove);
            preview.appendChild(div);
});
}
            // SUBMIT PROPERTY
            document.getElementById("propertyForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();
            const amenities = Array.from(
            document.querySelectorAll(
            ".amenities input:checked"
            )
).map(item => item.value);
            const property = {
                title: document.getElementById("title").value,
            type: document.getElementById("type").value,
            price: Number(
            document.getElementById("price").value
            ),
            region: document.getElementById("region").value,
            location: document.getElementById("location").value,
            bedrooms: document.getElementById("bedrooms").value,
            bathrooms: document.getElementById("bathrooms").value,
            description: document.getElementById("description").value,
            amenities: amenities,
imageNames: selectedFiles.map(file => file.name),
            status: "Pending Approval"
};
            let properties = JSON.parse(
            localStorage.getItem("ownerProperties")
            ) || [];
            properties.push(property);
            properties.push(property);
            localStorage.setItem(
            "ownerProperties",
            JSON.stringify(properties)
            );
            alert(
            "Property submitted successfully!\n\n" +
            "Your property is waiting for admin approval."
            );
            this.reset();
            selectedFiles = [];
            preview.innerHTML = "";
});
            // CLEAR FORM
            function resetForm() {
if (confirm("Are you sure you want to clear this form?")) {
                document.getElementById("propertyForm").reset();
            selectedFiles = [];
            preview.innerHTML = "";
}
}
    </script>
</body>

</html>
