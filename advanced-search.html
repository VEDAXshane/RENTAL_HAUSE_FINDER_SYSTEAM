
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advanced Search - Smart Rental Finder</title>

    <style>
        /* GENERAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #14234e;
        }

        /* PAGE CONTAINER */
        .page-container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #102451;
        }

        .page-header p {
            color: #64748b;
            font-size: 14px;
        }

        .search-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
            align-items: stretch;
        }

        /* SEARCH PANEL */
        .search-panel {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
        }

        .search-panel h2 {
            font-size: 21px;
            margin-bottom: 22px;
            color: #102451;
        }

        /* FORM GROUP */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #243454;
        }

        .form-group select {
            width: 100%;
            height: 43px;
            border: 1px solid #dce4f1;
            background: #fbfdff;
            border-radius: 8px;
            padding: 0 12px;
            outline: none;
            color: #243454;
            font-size: 13px;
        }

        .form-group select:focus {
            border-color: #075bea;
            box-shadow: 0 0 0 3px rgba(7, 91, 234, 0.08);
        }

        /* CHECKBOXES */
        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: #34415c;
            cursor: pointer;
        }

        .checkbox-group input {
            accent-color: #075bea;
        }

        /* SEARCH BUTTON */
        .search-button {
            width: 100%;
            height: 45px;
            background: linear-gradient(90deg, #075bea, #0645cf);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-button:hover {
            background: #003bb5;
        }

        /* RIGHT VISUAL AREA */
        .visual-area {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            min-width: 0;
        }

        /* HOUSE IMAGE */
        .house-card {
            background: white;
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            min-height: 220px;
        }

        .house-card img {
            width: 100%;
            height: 100%;
            min-height: 200px;
            max-height: 270px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
        }

        /* MAP SECTION */
        .map-card {
            background: white;
            padding: 10px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            min-height: 220px;
        }

        .map-area {
            position: relative;
            min-height: 200px;
            height: 100%;
            overflow: hidden;
            border-radius: 10px;
            background-color: #e9eddd;
            background-image:
                linear-gradient(35deg, transparent 45%, #fff 46%, #fff 49%, transparent 50%),
                linear-gradient(110deg, transparent 40%, #fff 41%, #fff 44%, transparent 45%),
                linear-gradient(80deg, transparent 70%, #c6d8b7 71%, #c6d8b7 75%, transparent 76%),
                linear-gradient(150deg, transparent 20%, #d4e0c4 21%, #d4e0c4 27%, transparent 28%);
            background-size: 130px 100px, 170px 140px, 200px 160px, 180px 150px;
        }

        /* MAP ROADS */
        .road {
            position: absolute;
            height: 6px;
            width: 120%;
            background: white;
            border: 1px solid #d4d7cd;
        }

        .road.one {
            top: 35%;
            left: -10%;
            transform: rotate(-18deg);
        }

        .road.two {
            top: 70%;
            left: -5%;
            transform: rotate(15deg);
        }

        .road.three {
            top: 50%;
            left: -10%;
            transform: rotate(75deg);
            width: 100%;
        }

        .map-label {
            position: absolute;
            color: #56624d;
            font-size: 11px;
            font-weight: bold;
        }

        .label-one {
            top: 20%;
            left: 12%;
        }

        .label-two {
            bottom: 17%;
            right: 12%;
        }

        .label-three {
            top: 65%;
            left: 10%;
        }

        /* MAP PIN */
        .map-pin {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            z-index: 2;
            filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.2));
        }

        .map-location {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border-radius: 6px;
            padding: 7px 12px;
            color: #102451;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            white-space: nowrap;
        }

        /* RESULT MESSAGE */
        .result-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #e5efff;
            color: #0754d9;
            font-size: 12px;
            line-height: 1.5;
            display: none;
        }

        /* TABLET */
        @media(max-width: 950px) {
            .search-layout {
                grid-template-columns: 300px 1fr;
            }

            .search-panel {
                padding: 18px;
            }
        }

        /* MOBILE */
        @media(max-width: 700px) {
            .page-container {
                margin: 15px auto;
            }

            .search-layout {
                grid-template-columns: 1fr;
            }

            .visual-area {
                grid-template-rows: 210px 210px;
            }

            .search-panel h2 {
                font-size: 19px;
            }

            .page-header h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="page-container">

        <!-- PAGE HEADER -->
        <div class="page-header">
            <h1>Advanced Search</h1>
            <p>Find your ideal rental home by using the search filters below.</p>
        </div>

        <div class="search-layout">

            <!-- LEFT SEARCH FORM -->
            <section class="search-panel">

                <h2>Search Your Home</h2>

                <form id="searchForm">

                    <!-- LOCATION -->
                    <div class="form-group">

                        <label for="location">Location</label>

                        <select id="location" name="location">

                            <option value="All Areas">All Areas</option>

                            <option value="Mnadani">Mnadani</option>

                            <option value="Mazimbu">Mazimbu</option>

                            <option value="Kihonda">Kihonda</option>

                            <option value="Kingolwira">Kingolwira</option>

                            <option value="Sabasaba">Sabasaba</option>

                        </select>

                    </div>

                    <!-- PRICE RANGE -->
                    <div class="form-group">

                        <label for="price">Price Range (TZS)</label>

                        <select id="price" name="price">

                            <option value="all">Any Price</option>

                            <option value="25000-35000">
                                25,000 – 35,000
                            </option>

                            <option value="35000-40000">
                                35,000 – 40,000
                            </option>

                            <option value="40000-50000">
                                40,000 – 50,000
                            </option>

                            <option value="50000-60000">
                                50,000 – 60,000
                            </option>

                            <option value="60000-70000">
                                60,000 – 70,000
                            </option>

                            <option value="70000+">
                                70,000 and Above
                            </option>

                        </select>

                    </div>

                    <!-- PROPERTY TYPE -->
                    <div class="form-group">

                        <label for="propertyType">Property Type</label>

                        <select id="propertyType" name="propertyType">

                            <option value="All Types">All Types</option>

                            <option value="House">House</option>

                            <option value="Apartment">Apartment</option>

                            <option value="Single Room">Single Room</option>

                            <option value="Double Room">Double Room</option>

                            <option value="Self Contained">Self Contained</option>

                            <option value="Studio">Studio</option>

                        </select>

                    </div>

                    <!-- BEDROOMS -->
                    <div class="form-group">

                        <label for="bedrooms">Bedrooms</label>

                        <select id="bedrooms" name="bedrooms">

                            <option value="Any">Any</option>

                            <option value="1">1 Bedroom</option>

                            <option value="2">2 Bedrooms</option>

                            <option value="3">3 Bedrooms</option>

                            <option value="4+">4 or More Bedrooms</option>

                        </select>

                    </div>

                    <!-- CHECKBOXES -->
                    <div class="checkbox-group">

                        <label for="photos">
                            <input type="checkbox" id="photos" name="photos">
                            With Photos
                        </label>

                        <label for="video">
                            <input type="checkbox" id="video" name="video">
                            With Video
                        </label>

                    </div>

                    <!-- SEARCH BUTTON -->
                    <button type="submit" class="search-button">
                        🔍 Search Homes
                    </button>

                    <!-- RESULT MESSAGE -->
                    <div class="result-message" id="resultMessage"></div>

                </form>

            </section>

            <!-- RIGHT VISUAL AREA -->
            <section class="visual-area">

                <!-- HOUSE IMAGE -->
                <div class="house-card">

                    <img src="image009.jpg"
                         alt="Rental house in Morogoro">

                </div>

                <!-- MAP -->
                <div class="map-card">

                    <div class="map-area">

                        <div class="road one"></div>
                        <div class="road two"></div>
                        <div class="road three"></div>

                        <span class="map-label label-one">
                            Morogoro
                        </span>

                        <span class="map-label label-two">
                            Residential Area
                        </span>

                        <span class="map-label label-three">
                            Main Road
                        </span>

                        <div class="map-pin">📍</div>

                        <div class="map-location">
                            Morogoro
                        </div>

                    </div>

                </div>

            </section>

        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>

        const searchForm = document.getElementById("searchForm");

        searchForm.addEventListener("submit", function(event) {

            event.preventDefault();

            // GET FORM VALUES
            const location = document.getElementById("location").value;
            const price = document.getElementById("price").value;
            const propertyType = document.getElementById("propertyType").value;
            const bedrooms = document.getElementById("bedrooms").value;
            const photos = document.getElementById("photos").checked;
            const video = document.getElementById("video").checked;

            // CREATE SEARCH OBJECT
            const searchData = {
                location: location,
                price: price,
                propertyType: propertyType,
                bedrooms: bedrooms,
                photos: photos,
                video: video
            };

            // SAVE SEARCH FILTERS
            localStorage.setItem(
                "rentalSearch",
                JSON.stringify(searchData)
            );

            // SHOW SEARCH MESSAGE
            const result = document.getElementById("resultMessage");

            result.style.display = "block";

            result.textContent =
                "Search filters saved! Location: " +
                location +
                ". Opening available properties...";

            // OPEN HOUSE LISTINGS PAGE
            setTimeout(function() {
                window.location.href = "house-listings.html";
            }, 1200);

        });

    </script>

</body>

</html>
