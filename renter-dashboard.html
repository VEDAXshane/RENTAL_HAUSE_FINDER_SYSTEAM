<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renter Dashboard | Smart Rental Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #edf2ff;
            color: #101e49;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
            padding: 8px;
            gap: 0;
        }

        /* SIDEBAR */
        .sidebar {
            width: 205px;
            flex-shrink: 0;
            background: #102b68;
            color: white;
            border-radius: 12px 0 0 12px;
            padding: 20px 12px;
        }

        .user-profile {
            display: flex;
            justify-content: center;
            margin-bottom: 27px;
            margin-bottom: 27px;
        }

        .user-profile img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: 8px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 10px;
            text-decoration: none;
            color: #e0eaff;
            border-radius: 7px;
            font-size: 12px;
            transition: 0.3s;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: #075bea;
            color: white;
        }

        .sidebar-menu .icon {
            font-size: 16px;
        }

        /* MAIN CONTENT */
        /* MAIN CONTENT */
        .main {
            flex: 1;
            min-width: 0;
            background: #fff;
            padding: 20px;
            border-radius: 0 12px 12px 0;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 23px;
        }

        .welcome h1 {
            font-size: 25px;
            font-weight: 750;
            margin-bottom: 5px;
        }

        .welcome p {
            font-size: 13px;
            color: #53617d;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .notification {
            width: 38px;
            height: 38px;
            background: #edf3ff;
            border-radius: 50%;
            display: grid;
            place-items: center;
            position: relative;
            position: relative;
            cursor: pointer;
            font-size: 18px;
        }

        .notification::after {
            content: "";
            position: absolute;
            top: 7px;
            right: 8px;
            width: 8px;
            height: 8px;
            background: red;
            border-radius: 50%;
        }

        .header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .menu-toggle {
            display: none;
            background: #075bea;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-size: 20px;
        }

        /* STATISTICS */
        .statistics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 13px;
            margin-bottom: 20px;
        }
            .stat-card {
                min-height: 100px;
                border-radius: 12px;
                padding: 13px 8px;
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 5px;
            }

            .stat-card .stat-icon {
                font-size: 25px;
            }

            .stat-card h2 {
                font-size: 19px;
                font-weight: bold;
            }

            .stat-card p {
                font-size: 11px;
                font-weight: 600;
            }

            .available {
                background: #dfedff;
                color: #0754db;
            }

            .bookings {
                background: #ddf7e8;
                color: #168b4e;
            }

            .favorites {
                background: #ffe2ed;
                color: #e62e59;
            }

                .rating {
                    background: #fff0cf;
                    color: #db9000;
                }

                /* QUICK ACTIONS */
                .section-title {
                    font-size: 16px;
                    margin-bottom: 13px;
                    font-weight: bold;
                }

                .quick-actions {
                    display: grid;
                    grid-template-columns: repeat(4, 1fr);
                    gap: 12px;
                    margin-bottom: 18px;
                }

                .action {
                    border: none;
                    min-height: 85px;
                    border-radius: 10px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    flex-direction: column;
                    gap: 8px;
                    cursor: pointer;
                    transition: 0.3s;
                }

                .action:hover {
                    transform: translateY(-4px);
                    box-shadow: 0 5px 12px rgba(0, 0, 0, 0.1);
                }

                .action span {
                    font-size: 25px;
                }
                    .action strong {
                        font-size: 11px;
                        color: #132d68;
                    }

                    .search-action {
                        background: #dfebff;
                    }

                    .map-action {
                        background: #e7e7ff;
                    }

                    .booking-action {
                        background: #e0f6e8;
                    }

                    .chat-action {
                        background: #e3edff;
                    }

                    /* MOROGORO BANNER */
                    .banner {
                        width: 100%;
                        height: 170px;
                        overflow: hidden;
                        border-radius: 11px;
                        position: relative;
                    }

                    .banner img {
                        width: 100%;
                        height: 100%;
                        object-fit: cover;
                        display: block;
                    }

                    .banner-location {
                        position: absolute;
                        bottom: 12px;
                        left: 15px;
                        color: white;
                        color: white;
                        font-size: 12px;
                        font-weight: bold;
                        text-shadow: 0 2px 5px black;
                    }

                    /* MOBILE */
                    @media(max-width: 850px) {
                        .sidebar {
                            width: 175px;
                        }

                        .main {
                            padding: 15px;
                        }

                        .welcome h1 {
                            font-size: 21px;
                        }

                        .statistics {
                            gap: 8px;
                        }

                        .quick-actions {
                            gap: 8px;
                        }
                    }

                    @media(max-width: 600px) {
                        .dashboard {
                            padding: 0;
                        }

                        .sidebar {
                            position: fixed;
                            top: 0;
                            left: -220px;
                            height: 100vh;
                            width: 205px;
                            width: 205px;
                            z-index: 100;
                            border-radius: 0;
                            transition: 0.3s;
                        }

                        .sidebar.open {
                            left: 0;
                        }

                        .main {
                            width: 100%;
                            border-radius: 0;
                            padding: 15px;
                        }

                        .menu-toggle {
                            display: block;
                        }

                        .header {
                            gap: 10px;
                        }

                        .welcome {
                            flex: 1;
                        }

                        .welcome h1 {
                            font-size: 19px;
                        }

                        .welcome p {
                            font-size: 11px;
                        }

                        .header-right {
                            gap: 10px;
                        }

                        .header-avatar {
                            width: 34px;
                            width: 34px;
                            height: 34px;
                        }

                        .statistics {
                            grid-template-columns: repeat(2, 1fr);
                        }

                        .quick-actions {
                            grid-template-columns: repeat(2, 1fr);
                        }

                        .banner {
                            height: 155px;
                        }
                    }
    </style>
</head>

<body>
    <div class="dashboard">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="user-profile">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100" alt="User">
            </div>
            <ul class="sidebar-menu">
                <li>
                    <a href="renter-dashboard.html" class="active">
                        <span class="icon">▦</span>
                        Dashboard
                    </a>
                </li>
                </li>
                <li>
                    <a href="advanced-search.html">
                        <span class="icon">⌕</span>
                        Search Homes
                    </a>
                </li>
                <li>
                    <a href="my-bookings.html">
                        <span class="icon">▣</span>
                        My Bookings
                    </a>
                </li>
                <li>
                    <a href="chat.html">
                        <span class="icon">✉</span>
                        Messages
                    </a>
                </li>
                <li>
                    <a href="my-profile.html">
                        <span class="icon">♙</span>
                        My Profile
                    </a>
                </li>
                <li>
                    <a href="home.html" onclick="return confirmLogout()">
                        <span class="icon">⇥</span>
                        Logout
                    </a>
                </li>
            </ul>
        </aside>
        <!-- MAIN CONTENT -->
        <main class="main">
            <!-- HEADER -->
            <header class="header">
                <button class="menu-toggle" onclick="toggleSidebar()">
                    ☰
                </button>
                <div class="welcome">
                    <h1>Hello, Welcome!</h1>
                    <p>Find your dream home easily.</p>
                </div>
                <div class="header-right">
                    <div class="notification" onclick="openNotifications()">
                    </div>
                    <img class="header-avatar" src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100"
                        alt="Profile">
                </div>
            </header>
            <!-- STATISTICS CARDS -->
            <section class="statistics">
                <div class="stat-card available">
                    <div class="stat-card available">
                        <span class="stat-icon"> </span>
                        <h2>12</h2>
                        <p>Available</p>
                    </div>
                    <div class="stat-card bookings">
                        <span class="stat-icon"> </span>
                        <h2>3</h2>
                        <p>Bookings</p>
                    </div>
                    <div class="stat-card favorites">
                        <span class="stat-icon">¥ </span>
                        <h2>5</h2>
                        <p>Favorites</p>
                    </div>
                    <div class="stat-card rating">
                        <span class="stat-icon">³ </span>
                        <h2>4.5</h2>
                        <p>My Rating</p>
                    </div>
            </section>
            <!-- QUICK ACTIONS -->
            <section>
                <h2 class="section-title">
                    Quick Actions
                </h2>
                <div class="quick-actions">
                    <button class="action search-action" onclick="goTo('advanced-search.html')">
                        <span> </span>
                        <strong>Search Homes</strong>
                    </button>
                    <button class="action map-action" onclick="goTo('map.html')">
                        <span> </span>
                        <strong>View Map</strong>
                    </button>
                    <button class="action booking-action" onclick="goTo('my-bookings.html')">
                        <span> </span>
                        <strong>My Bookings</strong>
                    </button>
                    <button class="action chat-action" onclick="goTo('chat.html')">
                        <span> </span>
                        <span> </span>
                        <strong>Chat Now</strong>
                    </button>
                </div>
            </section>
            <!-- MOROGORO IMAGE -->
            <section class="banner">
                <img src="image016.jpg" alt="Morogoro Town">
                <div class="banner-location">
                    Morogoro
                </div>
            </section>
        </main>
    </div>
    <script>
        // MOBILE SIDEBAR
        function toggleSidebar() {
            document
                .getElementById("sidebar")
                .classList.toggle("open");
        }
        // NAVIGATION
        function goTo(page) {
            window.location.href = page;
        }
        // NOTIFICATIONS
        function openNotifications() {
            window.location.href = "notifications.html";
        }
        // LOGOUT
        function confirmLogout() {
            return confirm("Are you sure you want to logout?");
        }
    </script>
</body>

</html>
