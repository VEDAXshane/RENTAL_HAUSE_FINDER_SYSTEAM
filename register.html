<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Rental Finder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf2ff, #f4f7fc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .register-container {
            width: 100%;
            max-width: 950px;
            min-height: 620px;
            display: flex;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(15, 45, 100, 0.15);
        }

        .left-section {
            width: 42%;
            min-height: 620px;
            position: relative;
            background:
                linear-gradient(rgba(7,40,110,.25), rgba(5,35,100,.65)),
                url("https://images.unsplash.com/photo-1600596542815-ffad4c1539a9")
                center / cover no-repeat;
        }

        .left-content {
            position: absolute;
            left: 30px;
            right: 30px;
            bottom: 75px;
            color: white;
        }

        .left-content h2 {
            font-size: 29px;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .left-content p {
            font-size: 14px;
            line-height: 1.7;
            color: #eaf2ff;
        }

        .location-label {
            position: absolute;
            bottom: 22px;
            left: 25px;
            color: white;
            font-size: 13px;
            font-weight: bold;
        }

        .right-section {
            width: 58%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 55px;
        }

        .register-form {
            width: 100%;
            max-width: 390px;
        }

        .logo, .form-heading {
            text-align: center;
        }

        .logo {
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 9px;
            background: #eaf2ff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 29px;
        }

        .logo h2 {
            color: #0846ae;
            font-size: 22px;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .logo p, .form-heading p {
            color: #64748b;
            font-size: 12px;
        }

        .form-heading {
            margin-bottom: 20px;
        }

        .form-heading h1 {
            font-size: 25px;
            color: #10234d;
            margin-bottom: 7px;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 7px;
        }

        .input-box {
            height: 46px;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 13px;
            border: 1px solid #dce4f1;
            border-radius: 9px;
            background: #fbfdff;
        }

        .input-box:focus-within {
            border-color: #075bea;
            box-shadow: 0 0 0 3px rgba(7,91,234,.08);
            background: white;
        }

        .input-box span {
            margin-right: 10px;
            font-size: 16px;
        }

        .input-box input, .input-box select {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            color: #172554;
        }

        .password-toggle {
            border: none;
            background: transparent;
            color: #075bea;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button {
            width: 100%;
            height: 47px;
            margin-top: 8px;
            background: linear-gradient(90deg, #075bea, #0645cf);
            border: none;
            border-radius: 9px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button:hover {
            background: #003bb5;
            transform: translateY(-2px);
        }

        .message {
            text-align: center;
            font-size: 12px;
            margin-top: 12px;
            min-height: 18px;
        }

        .login-link, .back-home {
            text-align: center;
            margin-top: 17px;
            font-size: 12px;
            color: #64748b;
        }

        .login-link a {
            color: #075bea;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home a {
            color: #64748b;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .register-container {
                max-width: 650px;
                min-height: 570px;
            }

            .left-section { width: 35%; }
            .right-section { width: 65%; padding: 30px; }
            .left-content h2 { font-size: 23px; }
        }

        @media (max-width: 550px) {
            body { padding: 15px; }

            .register-container {
                flex-direction: column;
                max-width: 430px;
                min-height: auto;
            }

            .left-section {
                width: 100%;
                min-height: 175px;
            }

            .left-content {
                bottom: 35px;
                left: 22px;
            }

            .left-content h2 {
                font-size: 22px;
                margin-bottom: 5px;
            }

            .left-content p { font-size: 12px; }

            .location-label {
                bottom: 12px;
                right: 15px;
                left: auto;
                font-size: 11px;
            }

            .right-section {
                width: 100%;
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="left-section">
        <div class="left-content">
            <h2>Find a Home<br>That Fits You</h2>
            <p>
                Join Smart Rental Finder and discover
                convenient and affordable rental houses.
            </p>
        </div>

        <div class="location-label">Morogoro, Tanzania</div>
    </div>

    <div class="right-section">

        <form class="register-form" id="registerForm">

            <div class="logo">
                <div class="logo-icon">🏠</div>
                <h2>Smart Rental<br>Finder</h2>
                <p>Find a place you can call home.</p>
            </div>

            <div class="form-heading">
                <h1>Create Account</h1>
                <p>Start your journey with us</p>
            </div>

            <div class="input-group">
                <label for="fullName">Full Name</label>
                <div class="input-box">
                    <span>👤</span>
                    <input type="text" id="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name" required>
                </div>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-box">
                    <span>✉</span>
                    <input type="email" id="email"
                        placeholder="Enter your email address"
                        autocomplete="email" required>
                </div>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <div class="input-box">
                    <span>📞</span>
                    <input type="tel" id="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel" required>
                </div>
            </div>

            <div class="input-group">
                <label for="role">Account Type</label>
                <div class="input-box">
                    <span>👥</span>
                    <select id="role" required>
                        <option value="">Select account type</option>
                        <option value="renter">Renter</option>
                        <option value="owner">Owner</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-box">
                    <span>🔒</span>
                    <input type="password" id="password"
                        placeholder="Create password"
                        minlength="8" autocomplete="new-password"
                        required>
                    <button type="button" class="password-toggle"
                        onclick="togglePassword()" id="eyeButton">
                        Show
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-box">
                    <span>🔐</span>
                    <input type="password" id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="8" autocomplete="new-password"
                        required>
                </div>
            </div>

            <button type="submit" class="register-button">
                Create Account
            </button>

            <div class="message" id="message" aria-live="polite"></div>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

            <div class="back-home">
                <a href="home.html">← Back to Home</a>
            </div>

        </form>
    </div>
</div>

<script>
    function togglePassword() {
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const button = document.getElementById("eyeButton");

        const show = password.type === "password";

        password.type = show ? "text" : "password";
        confirmPassword.type = show ? "text" : "password";
        button.textContent = show ? "Hide" : "Show";
    }

    document.getElementById("registerForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            const fullName = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const phone = document.getElementById("phone").value.trim();
            const role = document.getElementById("role").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("message");

            function showMessage(text, color) {
                message.textContent = text;
                message.style.color = color;
            }

            if (!fullName || !email || !phone || !role || !password || !confirmPassword) {
                showMessage("Please fill in all fields.", "#dc2626");
                return;
            }

            if (password.length < 8) {
                showMessage("Password must contain at least 8 characters.", "#dc2626");
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.", "#dc2626");
                return;
            }

            let users = [];

            try {
                users = JSON.parse(localStorage.getItem("rentalUsers")) || [];

                if (!Array.isArray(users)) {
                    users = [];
                }
            } catch (error) {
                showMessage("Unable to read saved accounts. Please check browser storage.", "#dc2626");
                return;
            }

            const emailExists = users.some(user =>
                user.email && user.email.toLowerCase() === email
            );

            const phoneExists = users.some(user =>
                user.phone && user.phone.replace(/\s+/g, "") === phone.replace(/\s+/g, "")
            );

            if (emailExists) {
                showMessage("This email is already registered.", "#dc2626");
                return;
            }

            if (phoneExists) {
                showMessage("This phone number is already registered.", "#dc2626");
                return;
            }

            const userId = "USER-" + Date.now();

            const newUser = {
                id: userId,
                userId: userId,
                ownerId: role === "owner" ? userId : null,
                name: fullName,
                fullName: fullName,
                email: email,
                phone: phone,
                role: role,
                password: password,
                createdAt: new Date().toISOString()
            };

            users.push(newUser);

            try {
                localStorage.setItem("rentalUsers", JSON.stringify(users));

                showMessage(
                    "Account created successfully! Redirecting to login...",
                    "#075bea"
                );

                document.getElementById("registerForm").reset();

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1200);

            } catch (error) {
                showMessage(
                    "Could not save account. Browser storage may be full.",
                    "#dc2626"
                );
            }
        });
</script>

</body>
</html>
