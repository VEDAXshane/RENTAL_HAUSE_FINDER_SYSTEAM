<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Rental Finder</title>
    <style>
        /* GENERAL SETTINGS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #e8efff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        /* MAIN CONTAINER */
        .login-container {
            width: 900px;
            min-height: 550px;
            display: flex;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 30, 100, 0.18);
        }

        /* LEFT IMAGE SECTION */
        .left-section {
            width: 42%;
            width: 42%;
            min-height: 550px;
            position: relative;
            background:
                linear-gradient(rgba(0, 70, 200, 0.10),
                    rgba(0, 40, 150, 0.15)),
                url("https://images.unsplash.com/photo-1600596542815-ffad4c1539a9") center/cover no-repeat;
        }

        /* BLUE CURVED SHAPE */
        .left-section::before {
            content: "";
            position: absolute;
            top: 0;
            right: -65px;
            width: 130px;
            height: 100%;
            background: linear-gradient(180deg,
                    #075bea,
                    #003cbb);
            border-radius: 0 50% 50% 0;
            z-index: 1;
        }

        .left-section::after {
            content: "";
            position: absolute;
            top: 0;
            right: -95px;
            width: 100px;
            height: 100%;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 0 50% 50% 0;
        }

        /* LOCATION LABEL */

        .location-label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            z-index: 2;
        }

        /* RIGHT LOGIN SECTION */
        .right-section {
            width: 58%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 65px;
            position: relative;
            z-index: 2;
            background: white;
        }

        /* LOGIN FORM */
        .login-form {
            width: 100%;
            max-width: 390px;
        }

        /* LOGO */
        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            font-size: 43px;
            color: #075bea;
        }

        .logo h2 {
            color: #0846ae;
            font-size: 23px;
            font-size: 23px;
            margin-top: 5px;
            line-height: 1.2;
        }

        .logo p {
            font-size: 12px;
            color: #475569;
        }

        /* HEADING */
        .form-heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-heading h1 {
            font-size: 25px;
            color: #101f4d;
            margin-bottom: 8px;
        }

        .form-heading p {
            font-size: 13px;
            color: #64748b;
        }

        /* INPUT GROUP */
        .input-group {
            margin-bottom: 15px;
        }

        .input-box {
            width: 100%;
            height: 45px;
            border: 1px solid #dce4f1;
            border-radius: 9px;
            display: flex;
            align-items: center;
            padding: 0 13px;
            background: #fbfdff;
            transition: 0.3s;
            
        }

        .input-box:focus-within {
            border-color: #075bea;
            box-shadow: 0 0 0 3px rgba(7, 91, 234, 0.08);
        }

        .input-box span {
            font-size: 16px;
            margin-right: 10px;
        }

        .input-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            color: #172554;
        }

        .input-box button {
            border: none;
            background: transparent;
            color: #075bea;
            font-size: 12px;
        }

        /* REMEMBER PASSWORD */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 17px 0 20px;
            font-size: 11px;
            gap: 8px;
        }

        .remember {
            display: flex;
            align-items: center;
            align-items: center;
            gap: 6px;
            color: #334155;
        }

        .remember input {
            accent-color: #075bea;
        }

        .forgot-password {
            color: #075bea;
            font-weight: bold;
            text-decoration: none;
        }

        /* LOGIN BUTTON */
        .login-button {
            width: 100%;
            height: 47px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg,
                    #075bea,
                    #0645cf);
            color: white;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #003bb5;
            transform: translateY(-2px);
        }

        /* REGISTER LINK */
        .register-link {
            text-align: center;
            font-size: 12px;
            margin-top: 20px;
            margin-top: 20px;
            color: #64748b;
        }

        .register-link a {
            color: #075bea;
            font-weight: bold;
            text-decoration: none;
        }

        /* ERROR MESSAGE */
        .message {
            font-size: 12px;
            margin-top: 12px;
            text-align: center;
            color: #dc2626;
        }

        /* TABLET */
        @media(max-width: 768px) {
            .login-container {
                width: 100%;
                max-width: 600px;
                min-height: 500px;
            }

            .left-section {
                width: 35%;
            }

            .right-section {
                width: 65%;
                padding: 30px;
            }
        }

        /* MOBILE */
        @media(max-width: 550px) {

            body {
                padding: 15px;
            }

            .login-container {
                flex-direction: column;
                max-width: 420px;
                min-height: auto;
                border-radius: 20px;
            }

            .left-section {
                width: 100%;
                min-height: 145px;
                background-position: center 55%;
            }

            .left-section::before {
                top: auto;
                bottom: -35px;
                left: 0;
                right: 0;
                width: 100%;
                height: 70px;
                border-radius: 50% 50% 0 0;
            }

            .left-section::after {
                display: none;
            }

            .right-section {
                width: 100%;
                padding: 30px 25px;
            }

            .location-label {
                bottom: 12px;
            }

            .logo {
                margin-bottom: 18px;
                margin-bottom: 18px;
            }

            .form-heading h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <!-- MAIN LOGIN CONTAINER -->
    <div class="login-container">
        <!-- LEFT IMAGE SECTION -->
        <div class="left-section">
            <div class="location-label">
                Morogoro, Tanzania
            </div>
        </div>
        <!-- RIGHT LOGIN SECTION -->
        <div class="right-section">
            <form class="login-form" id="loginForm">
                <!-- LOGO -->
                <div class="logo">
                    <div class="logo-icon"> </div>
                    <h2>
                        Smart Rental<br>
                        Finder
                    </h2>
                </div>
                <!-- HEADING -->
                <div class="form-heading">
                    <h1>Welcome Back!</h1>
                    <p>Login to your account</p>
                </div>
                <!-- EMAIL OR PHONE -->
                <div class="input-group">
                    <div class="input-box">
                        <span> </span>
                        <input type="text" id="email" placeholder="Email or Phone Number" required>
                    </div>
                </div>
                <!-- PASSWORD -->
                <div class="input-group">
                    <div class="input-box">
                        <span> </span>
                        <input type="password" type="password" id="password" placeholder="Password" required>
                        <button type="button" onclick="togglePassword()" id="eyeButton">
                            Show
                        </button>
                    </div>
                </div>
                <!-- FORM OPTIONS -->
                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>
                    <a href="#" class="forgot-password" onclick="forgotPassword(event)">
                        Forgot Password?
                    </a>
                </div>
                <!-- LOGIN BUTTON -->
                <button type="submit" class="login-button">
                    Login
                </button>
                <!-- ERROR MESSAGE -->
                <div class="message" id="message"></div>
                <!-- REGISTER LINK -->
                <div class="register-link">
                    Don't have an account?
                    <a href="register.html">
                        Register here
                    </a>
                </div>
            </form>
        </div>
    </div>
    <!-- JAVASCRIPT -->
    <script>
        // SHOW AND HIDE PASSWORD
        function togglePassword() {
            const password =
                document.getElementById("password");
            const eyeButton =
                document.getElementById("eyeButton");
            document.getElementById("eyeButton");
            if (password.type === "password") {
                password.type = "text";
                eyeButton.textContent = "Hide";
            } else {
                password.type = "password";
                eyeButton.textContent = "Show";
            }
        }
        // FORGOT PASSWORD
        function forgotPassword(event) {
            event.preventDefault();
            alert("Password recovery feature will be available soon.");
        }
        // LOGIN FORM VALIDATION
        document.getElementById("loginForm")
            .addEventListener("submit", function (event) {
                event.preventDefault();
                const email =
                    document.getElementById("email").value.trim();
                const password =
                    document.getElementById("password").value.trim();
                const message =

                    document.getElementById("message");
                if (email === "" || password === "") {
                    message.textContent =
                        "Please fill in all required fields.";
                    return;
                }
                message.style.color = "#075bea";
                message.textContent =
                    "Login interface is working. Connect PHP and MySQL for authentication.";
            });
    </script>
</body>

</html>
