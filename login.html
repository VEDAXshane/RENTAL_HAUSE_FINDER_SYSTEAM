<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Rental Finder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf2ff, #f4f7fc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .login-container {
            width: 100%;
            max-width: 950px;
            min-height: 580px;
            display: flex;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(15,45,100,.15);
        }

        .left-section {
            width: 42%;
            min-height: 580px;
            position: relative;
            background:
                linear-gradient(rgba(7,40,110,.25), rgba(5,35,100,.65)),
                url("https://images.unsplash.com/photo-1600596542815-ffad4c1539a9")
                center / cover no-repeat;
        }

        .left-content {
            position: absolute;
            left: 30px;
            right: 30px;
            bottom: 75px;
            color: white;
        }

        .left-content h2 {
            font-size: 29px;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .left-content p {
            font-size: 14px;
            line-height: 1.7;
            color: #eaf2ff;
        }

        .location-label {
            position: absolute;
            bottom: 22px;
            left: 25px;
            color: white;
            font-size: 13px;
            font-weight: bold;
        }

        .right-section {
            width: 58%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 55px;
        }

        .login-form {
            width: 100%;
            max-width: 390px;
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
            background: #eaf2ff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .logo h2 {
            color: #0846ae;
            font-size: 23px;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .logo p {
            color: #64748b;
            font-size: 12px;
        }

        .form-heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-heading h1 {
            font-size: 26px;
            color: #10234d;
            margin-bottom: 8px;
        }

        .form-heading p {
            font-size: 13px;
            color: #64748b;
        }

        .input-group {
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 8px;
        }

        .input-box {
            width: 100%;
            height: 48px;
            border: 1px solid #dbe4f0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            background: #f9fbff;
        }

        .input-box:focus-within {
            border-color: #075bea;
            box-shadow: 0 0 0 3px rgba(7,91,234,.08);
            background: white;
        }

        .input-icon {
            font-size: 17px;
            margin-right: 10px;
        }

        .input-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            color: #172554;
        }

        .input-box button {
            border: none;
            background: transparent;
            color: #075bea;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 17px 0 22px;
            gap: 10px;
            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #334155;
            cursor: pointer;
        }

        .remember input {
            accent-color: #075bea;
        }

        .forgot-password {
            color: #075bea;
            font-weight: bold;
            text-decoration: none;
        }

        .login-button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #075bea, #0645cf);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        .login-button:hover {
            background: #003bb5;
            transform: translateY(-2px);
        }

        .message {
            min-height: 18px;
            font-size: 12px;
            margin-top: 14px;
            text-align: center;
        }

        .register-link {
            text-align: center;
            font-size: 12px;
            margin-top: 20px;
            color: #64748b;
        }

        .register-link a {
            color: #075bea;
            font-weight: bold;
            text-decoration: none;
        }

        .back-home {
            text-align: center;
            margin-top: 18px;
        }

        .back-home a {
            color: #64748b;
            font-size: 12px;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .login-container {
                max-width: 650px;
                min-height: 520px;
            }

            .left-section { width: 35%; }
            .right-section { width: 65%; padding: 35px; }
            .left-content h2 { font-size: 23px; }
        }

        @media (max-width: 550px) {
            body { padding: 15px; }

            .login-container {
                flex-direction: column;
                max-width: 430px;
                min-height: auto;
            }

            .left-section {
                width: 100%;
                min-height: 180px;
                background-position: center 55%;
            }

            .left-content {
                bottom: 35px;
                left: 22px;
            }

            .left-content h2 {
                font-size: 22px;
                margin-bottom: 5px;
            }

            .left-content p { font-size: 12px; }

            .location-label {
                bottom: 12px;
                right: 15px;
                left: auto;
                font-size: 11px;
            }

            .right-section {
                width: 100%;
                padding: 30px 24px;
            }

            .logo { margin-bottom: 20px; }
            .form-heading h1 { font-size: 23px; }
        }

        @media (max-width: 360px) {
            .right-section { padding: 25px 17px; }
            .form-options { font-size: 11px; }
            .form-heading h1 { font-size: 21px; }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="left-section">
        <div class="left-content">
            <h2>Find Your Perfect Home</h2>
            <p>
                Discover comfortable and affordable rental houses
                in the right location for you.
            </p>
        </div>

        <div class="location-label">Morogoro, Tanzania</div>
    </div>

    <div class="right-section">

        <form class="login-form" id="loginForm">

            <div class="logo">
                <div class="logo-icon">🏠</div>
                <h2>Smart Rental<br>Finder</h2>
                <p>Find a place you can call home.</p>
            </div>

            <div class="form-heading">
                <h1>Welcome Back!</h1>
                <p>Login to your account</p>
            </div>

            <div class="input-group">
                <label for="email">Email or Phone Number</label>
                <div class="input-box">
                    <span class="input-icon">✉</span>
                    <input type="text" id="email"
                        placeholder="Enter email or phone number"
                        autocomplete="username" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-box">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password" required>

                    <button type="button" onclick="togglePassword()"
                        id="eyeButton">Show</button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>

                <a href="#" class="forgot-password"
                    onclick="forgotPassword(event)">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="login-button">
                Login
            </button>

            <div class="message" id="message" aria-live="polite"></div>

            <div class="register-link">
                Don't have an account?
                <a href="register.html">Register here</a>
            </div>

            <div class="back-home">
                <a href="home.html">← Back to Home</a>
            </div>

        </form>
    </div>
</div>

<script>
    function togglePassword() {
        const password = document.getElementById("password");
        const eyeButton = document.getElementById("eyeButton");

        if (password.type === "password") {
            password.type = "text";
            eyeButton.textContent = "Hide";
        } else {
            password.type = "password";
            eyeButton.textContent = "Show";
        }
    }

    function forgotPassword(event) {
        event.preventDefault();

        alert(
            "Password recovery is not yet connected. " +
            "Please contact the system administrator."
        );
    }

    document.getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const identifier = document.getElementById("email")
                .value.trim().toLowerCase();

            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            function showMessage(text, color) {
                message.textContent = text;
                message.style.color = color;
            }

            let users = [];

            try {
                users = JSON.parse(localStorage.getItem("rentalUsers")) || [];

                if (!Array.isArray(users)) {
                    users = [];
                }
            } catch (error) {
                showMessage("Unable to read registered accounts.", "#dc2626");
                return;
            }

            if (users.length === 0) {
                showMessage(
                    "No registered accounts found. Please register first.",
                    "#dc2626"
                );
                return;
            }

            const normalizedPhone = identifier.replace(/\s+/g, "");

            const user = users.find(account => {
                const accountEmail = (account.email || "").toLowerCase();
                const accountPhone = (account.phone || "").replace(/\s+/g, "");

                return accountEmail === identifier ||
                       accountPhone === normalizedPhone;
            });

            if (!user || user.password !== password) {
                showMessage(
                    "Incorrect email/phone number or password.",
                    "#dc2626"
                );
                return;
            }

            const role = (user.role || "").toLowerCase();

            let dashboard = "";

            if (role === "renter") {
                dashboard = "renter-dashboard.html";
            } else if (role === "owner") {
                dashboard = "owner-dashboard.html";
            } else if (role === "admin") {
                dashboard = "admin-dashboard.html";
            } else {
                showMessage(
                    "Your account has an invalid role. Contact the administrator.",
                    "#dc2626"
                );
                return;
            }

            // Save the logged-in user's information.
            // Password is deliberately not copied into the login session.
            const currentUser = {
                id: user.id || user.userId || user.email,
                userId: user.userId || user.id || user.email,
                ownerId: role === "owner"
                    ? (user.ownerId || user.id || user.userId)
                    : null,
                name: user.name || user.fullName || "",
                fullName: user.fullName || user.name || "",
                email: user.email || "",
                phone: user.phone || "",
                phoneNumber: user.phone || "",
                role: role,
                createdAt: user.createdAt || ""
            };

            try {
                localStorage.setItem(
                    "rentalCurrentUser",
                    JSON.stringify(currentUser)
                );

                showMessage("Login successful! Opening your dashboard...", "#075bea");

                setTimeout(() => {
                    window.location.href = dashboard;
                }, 900);

            } catch (error) {
                showMessage(
                    "Unable to save login session. Please check browser storage.",
                    "#dc2626"
                );
            }
        });
</script>

</body>
</html>
