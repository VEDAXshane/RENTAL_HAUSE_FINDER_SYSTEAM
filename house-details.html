
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Details - Rental House Finder</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
    color: #1e293b;
}

header {
    background: white;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e5e7eb;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #2563eb;
}

header a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 20px;
}

.back-button {
    display: inline-block;
    margin-bottom: 20px;
    color: #2563eb;
    text-decoration: none;
}

.property-header {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.property-header h1 {
    margin-bottom: 10px;
}

.location {
    color: #64748b;
}

.price {
    font-size: 24px;
    color: #2563eb;
    font-weight: bold;
}

.main-card {
    background: white;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.05);
}

.main-image {
    width: 100%;
    height: 430px;
    object-fit: cover;
    border-radius: 14px;
    background: #e2e8f0;
}

.gallery {
    display: flex;
    gap: 12px;
    margin-top: 15px;
    overflow-x: auto;
}

.gallery img {
    width: 125px;
    height: 90px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    flex-shrink: 0;
}

.gallery img:hover {
    outline: 3px solid #2563eb;
}

.features {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin: 25px 0;
}

.feature {
    background: #f8fafc;
    padding: 18px;
    border-radius: 10px;
    text-align: center;
}

.feature h3 {
    color: #2563eb;
    margin-bottom: 6px;
}

.tabs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid #e2e8f0;
    margin-top: 25px;
}

.tab-button {
    background: none;
    border: none;
    padding: 15px;
    cursor: pointer;
    font-weight: bold;
    color: #64748b;
}

.tab-button.active {
    color: #2563eb;
    border-bottom: 3px solid #2563eb;
}

.tab-content {
    display: none;
    padding: 25px 5px;
}

.tab-content.active {
    display: block;
}

.video-box {
    background: #f8fafc;
    border-radius: 12px;
    padding: 15px;
}

.property-video {
    width: 100%;
    max-height: 500px;
    background: #000;
    border-radius: 12px;
}

.video-message {
    padding: 35px 15px;
    text-align: center;
    color: #64748b;
}

.owner-card {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #f8fafc;
    padding: 20px;
    border-radius: 12px;
    margin-top: 25px;
}

.owner-avatar {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #dbeafe;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2563eb;
    font-size: 22px;
    font-weight: bold;
}

.owner-info {
    flex: 1;
}

.owner-info p {
    color: #64748b;
    margin-top: 5px;
}

.action-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 25px;
}

.btn {
    padding: 14px 20px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    font-weight: bold;
}

.btn-primary {
    background: #2563eb;
    color: white;
    flex: 1;
}

.btn-secondary {
    background: #e2e8f0;
    color: #334155;
}

.btn:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

.badge {
    display: inline-block;
    padding: 7px 12px;
    background: #dcfce7;
    color: #166534;
    border-radius: 20px;
    font-size: 13px;
    margin-bottom: 10px;
}

.review {
    padding: 15px;
    background: #f8fafc;
    border-radius: 10px;
    margin-bottom: 12px;
}

.hidden {
    display: none !important;
}

@media(max-width:800px) {

    .main-image {
        height: 300px;
    }

    .features {
        grid-template-columns: repeat(2, 1fr);
    }

    .property-header {
        flex-direction: column;
    }
}

@media(max-width:480px) {

    .container {
        padding: 10px;
    }

    .main-card {
        padding: 15px;
    }

    .main-image {
        height: 230px;
    }

    .features {
        gap: 8px;
    }

    .feature {
        padding: 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Rental House Finder</div>
    <a href="home.html">Home</a>
</header>

<div class="container">

    <a href="house-listings.html" class="back-button">
        ← Back to Properties
    </a>

    <div id="loadingMessage">
        Loading property details...
    </div>

    <div id="propertyContainer" class="hidden">

        <div class="property-header">

            <div>
                <span class="badge" id="propertyStatus">Available</span>

                <h1 id="propertyName"></h1>

                <p class="location" id="propertyLocation"></p>
            </div>

            <div class="price" id="propertyPrice"></div>

        </div>

        <div class="main-card">

            <!-- MAIN PROPERTY IMAGE -->
            <img id="mainImage"
                 class="main-image"
                 src="image001.jpg"
                 alt="Property image">

            <!-- IMAGE GALLERY -->
            <div id="gallery" class="gallery"></div>

            <!-- PROPERTY FEATURES -->
            <div class="features">

                <div class="feature">
                    <h3 id="bedrooms">0</h3>
                    <p>Bedrooms</p>
                </div>

                <div class="feature">
                    <h3 id="bathrooms">0</h3>
                    <p>Bathrooms</p>
                </div>

                <div class="feature">
                    <h3 id="kitchens">0</h3>
                    <p>Kitchens</p>
                </div>

                <div class="feature">
                    <h3 id="parking">0</h3>
                    <p>Parking</p>
                </div>

            </div>

            <!-- TABS -->
            <div class="tabs">

                <button class="tab-button active"
                        data-tab="description">
                    Description
                </button>

                <button class="tab-button"
                        data-tab="photos">
                    Photos
                </button>

                <button class="tab-button"
                        data-tab="video">
                    Video Tour
                </button>

                <button class="tab-button"
                        data-tab="reviews">
                    Reviews
                </button>

            </div>

            <!-- DESCRIPTION -->
            <div id="description"
                 class="tab-content active">

                <h2>About this property</h2>

                <p id="propertyDescription"
                   style="margin-top:12px; line-height:1.8;">
                </p>

            </div>

            <!-- PHOTOS -->
            <div id="photos"
                 class="tab-content">

                <h2>Property Photos</h2>

                <div id="photoGallery"
                     class="gallery">
                </div>

            </div>

            <!-- VIDEO -->
            <div id="video"
                 class="tab-content">

                <h2>Property Video Tour</h2>

                <div class="video-box">

                    <div id="videoMessage"
                         class="video-message">
                        Loading video...
                    </div>

                    <video id="propertyVideoPlayer"
                           class="property-video"
                           controls
                           playsinline
                           preload="metadata"
                           style="display:none;">
                    </video>

                </div>

            </div>

            <!-- REVIEWS -->
            <div id="reviews"
                 class="tab-content">

                <h2>Property Reviews</h2>

                <div id="reviewsContainer"></div>

            </div>

            <!-- OWNER -->
            <div class="owner-card">

                <div class="owner-avatar">O</div>

                <div class="owner-info">

                    <h3 id="ownerName">Property Owner</h3>

                    <p>Property Owner</p>

                </div>

                <button class="btn btn-secondary"
                        id="chatOwnerButton">
                    Chat with Owner
                </button>

            </div>

            <!-- ACTIONS -->
            <div class="action-buttons">

                <button class="btn btn-secondary"
                        id="backButton">
                    Back
                </button>

                <button class="btn btn-primary"
                        id="bookButton">
                    Book This Property
                </button>

            </div>

        </div>

    </div>

</div>

<script>
// ========================================
// LOAD PROPERTY
// ========================================

let selectedProperty = JSON.parse(
    localStorage.getItem("selectedProperty") || "null"
);

const loadingMessage =
    document.getElementById("loadingMessage");

const propertyContainer =
    document.getElementById("propertyContainer");

if (!selectedProperty) {

    loadingMessage.innerHTML = `
        <h2>Property not found</h2>
        <p>Please return to the property listings page.</p>
        <br>
        <a href="house-listings.html">Browse Properties</a>
    `;

} else {

    loadingMessage.style.display = "none";
    propertyContainer.classList.remove("hidden");

    loadPropertyDetails(selectedProperty);
}

// ========================================
// DISPLAY PROPERTY
// ========================================

function formatPrice(price) {

    return "TZS " + Number(price || 0).toLocaleString() + " / month";
}

function loadPropertyDetails(property) {

    document.getElementById("propertyName").textContent =
        property.name || property.propertyName || "Rental Property";

    document.getElementById("propertyLocation").textContent =
        [property.location, property.city]
        .filter(Boolean)
        .join(", ");

    document.getElementById("propertyPrice").textContent =
        formatPrice(property.price);

    document.getElementById("propertyStatus").textContent =
        property.status || property.availability || "Available";

    document.getElementById("bedrooms").textContent =
        property.bedrooms ?? 0;

    document.getElementById("bathrooms").textContent =
        property.bathrooms ?? 0;

    document.getElementById("kitchens").textContent =
        property.kitchens ?? 0;

    document.getElementById("parking").textContent =
        property.parking ?? 0;

    document.getElementById("propertyDescription").textContent =
        property.description || "No description available.";

    document.getElementById("ownerName").textContent =
        property.ownerName || "Property Owner";

    const mainImage = document.getElementById("mainImage");

    mainImage.src = property.image || "image001.jpg";

    // Gallery
    loadGallery(property);

    // Video
    displayPropertyVideo(property);

    // Reviews
    loadReviews(property);

    // Booking
    configureBooking(property);
}

// ========================================
// IMAGE GALLERY
// ========================================

function loadGallery(property) {

    const gallery = document.getElementById("gallery");
    const photoGallery = document.getElementById("photoGallery");

    gallery.innerHTML = "";
    photoGallery.innerHTML = "";

    let images = [];

    if (Array.isArray(property.images)) {
        images = property.images;
    }

    if (property.image && !images.includes(property.image)) {
        images.unshift(property.image);
    }

    if (images.length === 0) {
        images = ["image001.jpg"];
    }

    images.forEach(imageSource => {

        const image = document.createElement("img");

        image.src = imageSource;
        image.alt = "Property photo";

        image.addEventListener("click", function() {

            document.getElementById("mainImage").src =
                imageSource;
        });

        gallery.appendChild(image.cloneNode(true));

        const photo = image.cloneNode(true);

        photo.addEventListener("click", function() {

            document.getElementById("mainImage").src =
                imageSource;
        });

        photoGallery.appendChild(photo);
    });

    // Main image changes from either gallery
    gallery.querySelectorAll("img").forEach(img => {

        img.addEventListener("click", function() {

            document.getElementById("mainImage").src = img.src;
        });
    });
}

// ========================================
// INDEXED DB VIDEO
// ========================================

const VIDEO_DB_NAME = "RentalHouseVideoDB";
const VIDEO_STORE_NAME = "propertyVideos";

function openVideoDB() {

    return new Promise((resolve, reject) => {

        const request = indexedDB.open(VIDEO_DB_NAME, 1);

        request.onupgradeneeded = function(event) {

            const db = event.target.result;

            if (!db.objectStoreNames.contains(VIDEO_STORE_NAME)) {

                db.createObjectStore(VIDEO_STORE_NAME, {
                    keyPath: "videoId"
                });
            }
        };

        request.onsuccess = () => resolve(request.result);

        request.onerror = () => reject(request.error);
    });
}

async function getPropertyVideo(videoId) {

    const db = await openVideoDB();

    return new Promise((resolve, reject) => {

        const transaction = db.transaction(
            VIDEO_STORE_NAME,
            "readonly"
        );

        const store = transaction.objectStore(VIDEO_STORE_NAME);

        const request = store.get(videoId);

        request.onsuccess = function() {

            db.close();

            resolve(request.result || null);
        };

        request.onerror = function() {

            db.close();

            reject(request.error);
        };
    });
}

let activeVideoObjectURL = null;

const propertyVideoPlayer =
    document.getElementById("propertyVideoPlayer");

const videoMessage =
    document.getElementById("videoMessage");

async function displayPropertyVideo(property) {

    propertyVideoPlayer.pause();

    propertyVideoPlayer.removeAttribute("src");

    propertyVideoPlayer.load();

    propertyVideoPlayer.style.display = "none";

    videoMessage.style.display = "block";

    videoMessage.textContent = "Loading property video...";

    if (activeVideoObjectURL) {

        URL.revokeObjectURL(activeVideoObjectURL);

        activeVideoObjectURL = null;
    }

    if (!property || !property.videoId) {

        videoMessage.textContent =
            "No video available for this property.";

        return;
    }

    try {

        const videoRecord = await getPropertyVideo(
            property.videoId
        );

        if (!videoRecord || !videoRecord.file) {

            videoMessage.textContent =
                "The property video is currently unavailable.";

            return;
        }

        activeVideoObjectURL = URL.createObjectURL(
            videoRecord.file
        );

        propertyVideoPlayer.src = activeVideoObjectURL;

        propertyVideoPlayer.style.display = "block";

        videoMessage.style.display = "none";

        propertyVideoPlayer.load();

    } catch (error) {

        console.error("Video loading error:", error);

        videoMessage.textContent =
            "Unable to load this property's video.";
    }
}

// ========================================
// TABS
// ========================================

document.querySelectorAll(".tab-button").forEach(button => {

    button.addEventListener("click", function() {

        const targetTab = this.dataset.tab;

        document.querySelectorAll(".tab-button").forEach(btn => {
            btn.classList.remove("active");
        });

        document.querySelectorAll(".tab-content").forEach(content => {
            content.classList.remove("active");
        });

        this.classList.add("active");

        document.getElementById(targetTab)
            .classList.add("active");
    });
});

// ========================================
// REVIEWS
// ========================================

function loadReviews(property) {

    const container = document.getElementById("reviewsContainer");

    container.innerHTML = "";

    // Demo reviews
    const reviews = property.reviewsList || [];

    if (!reviews.length) {

        container.innerHTML = `
            <div class="review">
                <p>No reviews available for this property yet.</p>
            </div>
        `;

        return;
    }

    reviews.forEach(review => {

        const card = document.createElement("div");

        card.className = "review";

        card.innerHTML = `
            <h3></h3>
            <p style="margin-top:8px;"></p>
        `;

        card.querySelector("h3").textContent =
            review.name || "Guest";

        card.querySelector("p").textContent =
            review.comment || "";

        container.appendChild(card);
    });
}

// ========================================
// BOOKING
// ========================================

function configureBooking(property) {

    const bookButton = document.getElementById("bookButton");

    const status = property.status || property.availability || "Available";

    if (status !== "Available" && status !== "Approved") {

        bookButton.disabled = true;

        bookButton.textContent = "Property Not Available";

    } else {

        bookButton.disabled = false;

        bookButton.textContent = "Book This Property";
    }

    bookButton.addEventListener("click", function() {

        if (bookButton.disabled) return;

        localStorage.setItem(
            "selectedProperty",
            JSON.stringify(property)
        );

        localStorage.setItem(
            "rentalBookingProperty",
            JSON.stringify(property)
        );

        window.location.href = "booking.html";
    });
}

// ========================================
// CHAT WITH OWNER
// ========================================

document.getElementById("chatOwnerButton")
.addEventListener("click", function() {

    localStorage.setItem(
        "rentalChatPropertyContext",
        JSON.stringify(selectedProperty)
    );

    window.location.href =
        "chat.html?propertyId=" + encodeURIComponent(selectedProperty.id || "");
});

// ========================================
// BACK BUTTON
// ========================================

document.getElementById("backButton")
.addEventListener("click", function() {

    window.location.href = "house-listings.html";
});

// ========================================
// CLEAN UP VIDEO URL
// ========================================

window.addEventListener("beforeunload", function() {

    propertyVideoPlayer.pause();

    if (activeVideoObjectURL) {

        URL.revokeObjectURL(activeVideoObjectURL);
    }
});
</script>

</body>
</html>
