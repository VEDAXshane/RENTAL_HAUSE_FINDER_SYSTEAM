<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Listings - Smart Rental Finder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #102451;
        }

        .container {
            width: 100%;
            max-width: 1250px;
            margin: 25px auto;
            padding: 15px;
        }

        .listing-section {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        /* HEADER */
        .listing-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .listing-header h1 {
            font-size: 23px;
            color: #102451;
        }

        .listing-header p {
            color: #64748b;
            font-size: 13px;
            margin-top: 5px;
        }

        .sort-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sort-container label {
            font-size: 12px;
            font-weight: bold;
        }

        .sort-container select {
            padding: 9px 12px;
            border: 1px solid #d9e2f0;
            border-radius: 7px;
            background: white;
            color: #14234e;
            font-size: 12px;
            outline: none;
        }

        /* SEARCH */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #d9e2f0;
            border-radius: 8px;
            outline: none;
            font-size: 13px;
        }

        .search-box input:focus {
            border-color: #075bea;
        }

        .search-box button {
            padding: 12px 18px;
            background: #075bea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .search-box button:hover {
            background: #003db6;
        }

        /* RESULTS */
        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 12px;
            color: #64748b;
        }

        /* PROPERTY GRID */
        .property-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        /* PROPERTY CARD */
        .property-card {
            background: #ffffff;
            border: 1px solid #e6ecf6;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
            transition: 0.3s;
            min-width: 0;
        }

        .property-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        /* PROPERTY IMAGE */
        .image-container {
            height: 190px;
            position: relative;
            overflow: hidden;
            background: #e2e8f0;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: 0.4s;
        }

        .property-card:hover .image-container img {
            transform: scale(1.04);
        }

        .image-placeholder {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 13px;
        }

        /* STATUS */
        .status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #dcfce7;
            color: #166534;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
        }

        /* FAVORITE */
        .favorite-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 34px;
            height: 34px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 50%;
            font-size: 21px;
            color: #102451;
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .favorite-btn.active {
            color: #ef244d;
        }

        /* VIDEO BADGE */
        .video-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(16, 36, 81, 0.85);
            color: white;
            padding: 6px 9px;
            border-radius: 5px;
            font-size: 10px;
        }

        /* PROPERTY INFORMATION */
        .property-info {
            padding: 15px;
        }

        .property-info h2 {
            font-size: 15px;
            margin-bottom: 8px;
            color: #14234e;
        }

        .location {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 12px;
        }

        .location span {
            color: #075bea;
            margin-right: 4px;
        }

        /* PRICE */
        .price {
            font-size: 15px;
            color: #075bea;
            font-weight: bold;
            margin-bottom: 13px;
        }

        .price small {
            font-size: 11px;
            font-weight: normal;
            color: #64748b;
        }

        /* FEATURES */
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 10px 0;
            border-top: 1px solid #edf1f7;
            border-bottom: 1px solid #edf1f7;
            margin-bottom: 12px;
        }

        .features span {
            font-size: 11px;
            color: #64748b;
        }

        /* FOOTER */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .rating {
            color: #e9a400;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .rating small {
            color: #64748b;
            font-size: 10px;
            font-weight: normal;
        }

        .details-btn {
            background: #075bea;
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 7px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }

        .details-btn:hover {
            background: #003db6;
        }

        /* NO RESULTS */
        .no-results {
            display: none;
            text-align: center;
            padding: 50px 15px;
            color: #64748b;
        }

        .no-results h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .no-results p {
            font-size: 13px;
            margin-bottom: 18px;
        }

        .reset-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 7px;
            background: #075bea;
            color: white;
            cursor: pointer;
        }

        /* TABLET */
        @media(max-width: 850px) {
            .property-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .listing-header h1 {
                font-size: 20px;
            }
        }

        /* MOBILE */
        @media(max-width: 550px) {
            .container {
                margin: 5px auto;
                padding: 8px;
            }

            .listing-section {
                padding: 12px;
            }

            .listing-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .listing-header h1 {
                font-size: 19px;
            }

            .property-grid {
                grid-template-columns: 1fr;
            }

            .image-container {
                height: 210px;
            }

            .property-info {
                padding: 14px;
            }

            .search-box button {
                padding: 11px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <section class="listing-section">

            <!-- HEADER -->
            <div class="listing-header">

                <div>
                    <h1>Available Homes in Morogoro</h1>
                    <p>Find a home that fits your needs and budget.</p>
                </div>

                <div class="sort-container">

                    <label for="sortBy">Sort by:</label>

                    <select id="sortBy">
                        <option value="newest">Newest First</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Highest Rating</option>
                    </select>

                </div>

            </div>

            <!-- SEARCH -->
            <div class="search-box">

                <input type="text"
                       id="searchInput"
                       placeholder="Search by house name or location...">

                <button onclick="applyFilters()">Search</button>

            </div>

            <!-- RESULTS -->
            <div class="results-info">

                <p id="resultsCount">Available properties</p>

            </div>

            <!-- PROPERTY GRID -->
            <div class="property-grid" id="propertyGrid"></div>

            <!-- NO RESULTS -->
            <div class="no-results" id="noResults">

                <h2>No Properties Found</h2>

                <p>
                    No houses match your search.
                    Try another location or search term.
                </p>

                <button class="reset-btn" onclick="resetFilters()">
                    Show All Properties
                </button>

            </div>

        </section>

    </div>

    <script>

        /* DEMO PROPERTIES */

        const demoProperties = [

            {
                id: "house1",
                name: "3 Bedroom House",
                propertyType: "House",
                location: "Morogoro",
                city: "Morogoro",
                price: 550000,
                bedrooms: 3,
                bathrooms: 2,
                kitchens: 1,
                parking: "Available",
                status: "Approved",
                availability: "Available",
                image: "image019.jpg",
                images: ["image019.jpg"],
                rating: 4.6,
                reviews: 24,
                createdAt: 3
            },

            {
                id: "house2",
                name: "2 Bedroom House",
                propertyType: "House",
                location: "Mazimbu",
                city: "Morogoro",
                price: 350000,
                bedrooms: 2,
                bathrooms: 1,
                kitchens: 1,
                parking: "Available",
                status: "Approved",
                availability: "Available",
                image: "image020.jpg",
                images: ["image020.jpg"],
                rating: 4.4,
                reviews: 18,
                createdAt: 2
            },

            {
                id: "house3",
                name: "1 Bedroom Room",
                propertyType: "Room",
                location: "Kihonda Area",
                city: "Morogoro",
                price: 180000,
                bedrooms: 1,
                bathrooms: 1,
                kitchens: 1,
                parking: "Not Available",
                status: "Approved",
                availability: "Available",
                image: "image022.jpg",
                images: ["image022.jpg"],
                rating: 4.3,
                reviews: 12,
                createdAt: 1
            }

        ];


        /* READ OWNER PROPERTIES */

        function getOwnerProperties() {

            try {

                const savedProperties = JSON.parse(
                    localStorage.getItem("ownerProperties") || "[]"
                );

                return Array.isArray(savedProperties)
                    ? savedProperties
                    : [];

            } catch (error) {

                console.error("Unable to read owner properties:", error);

                return [];

            }

        }


        /* APPROVED PROPERTIES */

        function getApprovedOwnerProperties() {

            return getOwnerProperties().filter(property => {

                return String(property.status || "")
                    .trim()
                    .toLowerCase() === "approved";

            });

        }


        /* COMBINE PROPERTIES */

        let allProperties = [
            ...demoProperties,
            ...getApprovedOwnerProperties()
        ];


        /* FAVORITES */

        let favorites = [];

        try {

            favorites = JSON.parse(
                localStorage.getItem("favorites") || "[]"
            );

            if (!Array.isArray(favorites)) {
                favorites = [];
            }

        } catch (error) {

            favorites = [];

        }


        /* FORMAT PRICE */

        function formatPrice(price) {

            return Number(price || 0).toLocaleString("en-US");

        }


        /* GET IMAGE */

        function getPropertyImage(property) {

            if (Array.isArray(property.images) &&
                property.images.length > 0) {

                return property.images[0];

            }

            if (property.image) {

                return property.image;

            }

            return "";

        }


        /* ESCAPE HTML */

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* DISPLAY PROPERTIES */

        function displayProperties(properties) {

            const grid = document.getElementById("propertyGrid");

            const noResults = document.getElementById("noResults");

            const resultsCount = document.getElementById("resultsCount");

            grid.innerHTML = "";

            if (properties.length === 0) {

                grid.style.display = "none";

                noResults.style.display = "block";

                resultsCount.textContent = "0 properties found";

                return;

            }

            grid.style.display = "grid";

            noResults.style.display = "none";

            resultsCount.textContent =
                properties.length + " properties found";


            properties.forEach(property => {

                const propertyId = String(property.id);

                const image = getPropertyImage(property);

                const isFavorite = favorites.includes(propertyId);

                const hasVideo = Boolean(property.videoId);

                const rating = property.rating || 0;

                const reviews = property.reviews || 0;

                const bedrooms = property.bedrooms ?? "N/A";

                const bathrooms = property.bathrooms ?? "N/A";

                const location =
                    property.location || property.city || "Location not specified";

                const name =
                    property.name || property.propertyType || "Rental Property";


                const card = document.createElement("div");

                card.className = "property-card";

                card.dataset.id = propertyId;

                card.dataset.price = Number(property.price || 0);

                card.dataset.rating = Number(rating);

                card.dataset.date = property.createdAt || property.date || 0;


                card.innerHTML = `

                    <div class="image-container">

                        ${
                            image
                            ?
                            `<img src="${escapeHTML(image)}"
                                  alt="${escapeHTML(name)}"
                                  onerror="this.style.display='none'">`
                            :
                            `<div class="image-placeholder">
                                No image available
                             </div>`
                        }

                        <span class="status-badge">
                            ${escapeHTML(property.availability || "Available")}
                        </span>

                        <button class="favorite-btn ${isFavorite ? "active" : ""}"
                                onclick="toggleFavorite('${escapeHTML(propertyId)}', this)"
                                title="Add to favorites">

                            ${isFavorite ? "♥" : "♡"}

                        </button>

                        ${
                            hasVideo
                            ?
                            `<span class="video-badge">▶ Video Tour Available</span>`
                            :
                            ""
                        }

                    </div>

                    <div class="property-info">

                        <h2>${escapeHTML(name)}</h2>

                        <p class="location">
                            <span>📍</span>
                            ${escapeHTML(location)}
                        </p>

                        <p class="price">
                            TZS ${formatPrice(property.price)}
                            <small>/ month</small>
                        </p>

                        <div class="features">

                            <span>🛏 ${escapeHTML(bedrooms)} Bedrooms</span>

                            <span>🚿 ${escapeHTML(bathrooms)} Bathrooms</span>

                        </div>

                        <div class="card-footer">

                            <div class="rating">

                                ${
                                    rating > 0
                                    ?
                                    `★ ${rating}
                                     <small>(${reviews} reviews)</small>`
                                    :
                                    `<small>No reviews yet</small>`
                                }

                            </div>

                            <button class="details-btn"
                                    onclick="viewDetails('${escapeHTML(propertyId)}')">

                                View Details

                            </button>

                        </div>

                    </div>

                `;

                grid.appendChild(card);

            });

        }


        /* TOGGLE FAVORITE */

        function toggleFavorite(id, button) {

            if (favorites.includes(id)) {

                favorites = favorites.filter(item => item !== id);

                button.classList.remove("active");

                button.textContent = "♡";

            } else {

                favorites.push(id);

                button.classList.add("active");

                button.textContent = "♥";

            }

            localStorage.setItem(
                "favorites",
                JSON.stringify(favorites)
            );

        }


        /* VIEW DETAILS */

        function viewDetails(id) {

            const property = allProperties.find(
                item => String(item.id) === String(id)
            );

            if (!property) {

                alert("Property not found.");

                return;

            }

            localStorage.setItem(
                "selectedProperty",
                JSON.stringify(property)
            );

            window.location.href = "house-details.html";

        }


        /* SEARCH */

        function applyFilters() {

            const searchValue = document.getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();

            let filteredProperties = [...allProperties];


            /* SEARCH NAME, LOCATION, CITY OR TYPE */

            if (searchValue) {

                filteredProperties = filteredProperties.filter(property => {

                    const name = String(property.name || "")
                        .toLowerCase();

                    const location = String(property.location || "")
                        .toLowerCase();

                    const city = String(property.city || "")
                        .toLowerCase();

                    const type = String(property.propertyType || "")
                        .toLowerCase();

                    return name.includes(searchValue) ||
                           location.includes(searchValue) ||
                           city.includes(searchValue) ||
                           type.includes(searchValue);

                });

            }


            /* ADVANCED SEARCH FILTER */

            const savedSearch = localStorage.getItem("rentalSearch");

            if (savedSearch) {

                try {

                    const filters = JSON.parse(savedSearch);


                    /* LOCATION FILTER */

                    if (filters.location &&
                        filters.location !== "All Areas") {

                        filteredProperties = filteredProperties.filter(property => {

                            const propertyLocation =
                                String(property.location || "").toLowerCase();

                            const propertyCity =
                                String(property.city || "").toLowerCase();

                            const selectedLocation =
                                String(filters.location).toLowerCase();

                            return propertyLocation.includes(selectedLocation) ||
                                   propertyCity.includes(selectedLocation);

                        });

                    }


                    /* PRICE FILTER */

                    if (filters.price) {

                        const parts = String(filters.price)
                            .split("-")
                            .map(Number);

                        if (parts.length === 2 &&
                            parts.every(value => Number.isFinite(value))) {

                            const min = parts[0];

                            const max = parts[1];

                            filteredProperties = filteredProperties.filter(property => {

                                const price = Number(property.price || 0);

                                return price >= min && price <= max;

                            });

                        }

                    }

                } catch (error) {

                    console.error("Invalid rental search data:", error);

                }

            }


            displayProperties(filteredProperties);

        }


        /* SORT */

        function sortProperties() {

            const sortType = document.getElementById("sortBy").value;

            let properties = [...allProperties];


            const searchValue = document.getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();


            /* SEARCH FILTER */

            if (searchValue) {

                properties = properties.filter(property => {

                    const name = String(property.name || "").toLowerCase();

                    const location = String(property.location || "").toLowerCase();

                    const city = String(property.city || "").toLowerCase();

                    const type = String(property.propertyType || "").toLowerCase();

                    return name.includes(searchValue) ||
                           location.includes(searchValue) ||
                           city.includes(searchValue) ||
                           type.includes(searchValue);

                });

            }


            /* SORT DATA */

            properties.sort((a, b) => {

                if (sortType === "price-low") {

                    return Number(a.price || 0) -
                           Number(b.price || 0);

                }

                if (sortType === "price-high") {

                    return Number(b.price || 0) -
                           Number(a.price || 0);

                }

                if (sortType === "rating") {

                    return Number(b.rating || 0) -
                           Number(a.rating || 0);

                }

                return new Date(b.createdAt || 0) -
                       new Date(a.createdAt || 0);

            });


            displayProperties(properties);

        }


        /* RESET SEARCH */

        function resetFilters() {

            document.getElementById("searchInput").value = "";

            document.getElementById("sortBy").value = "newest";

            localStorage.removeItem("rentalSearch");

            allProperties = [
                ...demoProperties,
                ...getApprovedOwnerProperties()
            ];

            displayProperties(allProperties);

        }


        /* ENTER KEY SEARCH */

        document.getElementById("searchInput")
            .addEventListener("keyup", function(event) {

                if (event.key === "Enter") {

                    applyFilters();

                }

            });


        /* SORT EVENT */

        document.getElementById("sortBy")
            .addEventListener("change", sortProperties);


        /* INITIAL LOAD */

        displayProperties(allProperties);

        applyFilters();

    </script>

</body>

</html>
